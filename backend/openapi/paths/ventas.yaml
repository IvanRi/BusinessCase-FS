get:
  summary: Detalle paginado de ventas del período
  parameters:
    - name: desde
      in: query
      schema:
        type: string
        format: date
    - name: hasta
      in: query
      schema:
        type: string
        format: date
    - name: pagina
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    - name: por_pagina
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
  responses:
    "200":
      description: Página de ventas (sin consolidado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaginaVentas"
post:
  summary: Alta de una venta
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/Venta"
  responses:
    "201":
      description: Venta creada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AltaCreada"
    "400":
      description: Venta inválida o cuerpo ilegible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Id de venta existente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
